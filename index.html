<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Story ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background: #fff5f5;
            color: #6b3038;
            overflow: hidden;
        }

        .opening {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 30px;
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 700px;
            animation: fadeIn 2s ease;
        }

        .small-text {
            font-size: 17px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
            opacity: 0.75;
        }

        h1 {
            font-size: clamp(45px, 8vw, 85px);
            font-weight: normal;
            margin: 0;
            line-height: 1;
        }

        .subtitle {
            font-size: 21px;
            line-height: 1.8;
            margin: 30px auto;
            max-width: 550px;
        }

        .date {
            font-size: 16px;
            letter-spacing: 4px;
            margin-top: 35px;
        }

        .begin-button {
            margin-top: 35px;
            padding: 14px 32px;
            border: 1px solid #c9828a;
            border-radius: 30px;
            background: transparent;
            color: #6b3038;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .begin-button:hover {
            background: #c9828a;
            color: white;
            transform: translateY(-3px);
        }

        .flower {
            position: absolute;
            font-size: 35px;
            opacity: 0.55;
            animation: float 5s ease-in-out infinite;
        }

        .flower1 {
            top: 12%;
            left: 12%;
        }

        .flower2 {
            top: 20%;
            right: 13%;
            animation-delay: 1s;
        }

        .flower3 {
            bottom: 15%;
            left: 17%;
            animation-delay: 2s;
        }

        .flower4 {
            bottom: 12%;
            right: 15%;
            animation-delay: 3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @media (max-width: 600px) {
            .subtitle {
                font-size: 18px;
            }

            .small-text {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <section class="opening">

        <div class="flower flower1">🌸</div>
        <div class="flower flower2">🌷</div>
        <div class="flower flower3">🌸</div>
        <div class="flower flower4">🌷</div>

        <div class="content">

            <div class="small-text">
                30 October 2024
            </div>

            <h1>Our Story ♡</h1>

            <p class="subtitle">
                It started with something very small...
            </p>

            <div class="date">
                AND SOMEHOW, IT BECAME US
            </div>

            <button class="begin-button">
                Begin ♡
            </button>

        </div>

    </section>

</body>
</html>
